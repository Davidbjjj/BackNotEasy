spring.application.name=BancoDeDados
SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
SPRING_DATASOURCE_DRIVER_CLASS_NAME=${SPRING_DATASOURCE_DRIVER_CLASS_NAME}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html


server.port=${PORT:8080}
apikey=${APIkey}
# Serviço Python que executa o modelo.joblib (ver ml-service/)
modelo.url=${MODELO_URL:http://localhost:8001}
# true = o backend sobe o ml-service sozinho (modelo.joblib da raiz); false = você sobe à parte
modelo.autostart=false
modelo.python=python
# Habilita POST /seed/popular (dados mock). Desligue em produção.
seed.enabled=true
api.secret=12345
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
server.tomcat.max-http-header-size=65536
server.servlet.session.timeout=30m
spring.servlet.multipart.resolve-lazily=true
